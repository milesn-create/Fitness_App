server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Основной фронтенд - обслуживаем SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API запросы - прокси на backend
    # Локально: http://backend:8080 (из docker-compose)
    # На Railway: используйте переменную окружения BACKEND_URL
    location /api/ {
        set $backend_url "${BACKEND_URL}";
        if ($backend_url = "") {
            set $backend_url "http://backend:8080";
        }
        proxy_pass $backend_url/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Загруженные файлы
    location /uploads/ {
        try_files $uri @uploads_backend;
    }

    location @uploads_backend {
        set $backend_url "${BACKEND_URL}";
        if ($backend_url = "") {
            set $backend_url "http://backend:8080";
        }
        proxy_pass $backend_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
