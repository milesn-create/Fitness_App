# Railway configuration for Fitness App

# Define the services
services:
  backend:
    build:
      dockerfile: ./backend/Dockerfile
    port: 8080
    healthcheck:
      test: "curl -f http://localhost:8080/api/health || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - PORT
      - DB_HOST
      - DB_USER
      - DB_PASSWORD
      - DB_NAME
      - DB_PORT
      - JWT_SECRET
      - FRONTEND_URL
    depends_on:
      - postgres

  frontend:
    build:
      dockerfile: ./frontend/Dockerfile
    port: 80
    environment:
      - REACT_APP_API_URL
    depends_on:
      - backend

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD
      - POSTGRES_DB=fitness
    ports:
      - "5432"
